[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "viraldyn"
version = "0.1.0"
description = "Exact stochastic simulation of a two-strain within-host viral model"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
  { name = "Gaia Grossi" },
  { name = "Leonardo Vanni" },
]
dependencies = ["numpy", "scipy", "numba", "matplotlib"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
packages = ["viraldyn"]
